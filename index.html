<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Renovation Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style id="page-css">
/* Layout: one 8-bit "game screen" column — HUD hero with level bar, then quest panels in a 2-col grid that stacks on phones. Single committed light "construction site" look. */
:root{
  --concrete:#e2ddd0; --paper:#f8f5ec; --ink:#1f1c19; --muted:#6a6459;
  --hazard:#f2c230; --orange:#e5652a; --blue:#2f5d8a; --green:#4f8a3c; --red:#c23b2b;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--concrete);
  background-image:linear-gradient(rgba(31,28,25,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(31,28,25,.05) 1px,transparent 1px);
  background-size:16px 16px;
  color:var(--ink); font-family:var(--body); font-size:21px; line-height:1.2;
}
.hazard{height:14px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--ink) 14px 28px)}
.wrap{max-width:1060px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px}
h1,h2,h3,.px{font-family:var(--pixel);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(18px,4.4vw,34px);line-height:1.35}
h2{font-size:13px;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
h3{font-size:11px;line-height:1.5}
p{margin:0}
.sprite{display:block;image-rendering:pixelated;flex:none}
.panel{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--muted)}
.tag{font-family:var(--pixel);font-size:9px;letter-spacing:.08em;background:var(--ink);color:var(--hazard);padding:5px 7px;align-self:flex-start}

/* HUD */
.hud{background:var(--ink);color:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--orange);padding:22px;display:flex;flex-direction:column;gap:18px}
.hud-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hud .sub{color:var(--hazard);font-size:24px}
.big{font-family:var(--pixel);font-size:clamp(40px,10vw,76px);color:var(--hazard);line-height:1;font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 var(--orange)}
.big small{font-size:.4em;color:var(--paper);text-shadow:none}
.lvl{position:relative;padding-top:44px}
.bar{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;border:3px solid var(--paper);padding:3px;height:30px}
.bar i{background:#3a352f}
.bar i.on{background:var(--hazard)}
.bar i.on:nth-child(4n){background:var(--orange)}
.walker{position:absolute;top:0;transform:translateX(-50%);transition:left .6s steps(8)}
@media (prefers-reduced-motion:no-preference){.walker .sprite{animation:bob .5s steps(2) infinite}}
@keyframes bob{50%{transform:translateY(-3px)}}
.mood{font-size:24px}
.hud-meta{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:20px;color:#cfc8b8}
.hud-meta b{color:var(--paper);font-weight:400}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{background:var(--paper);border:4px solid var(--ink);padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.stat .v{font-family:var(--pixel);font-size:16px;font-variant-numeric:tabular-nums}
.stat .l{font-size:18px;color:var(--muted)}
.meter{height:10px;border:2px solid var(--ink);margin-top:6px;position:relative;overflow:hidden}
.meter span{position:absolute;inset:0 auto 0 0;background:var(--green)}
.meter.over span{background:var(--red)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.job{display:flex;gap:16px;align-items:flex-start}
.job .t{font-size:26px}
.done-stamp{font-family:var(--pixel);font-size:10px;color:var(--green);border:3px solid var(--green);padding:5px 7px;transform:rotate(-4deg);align-self:flex-start}
ul.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.quests li{display:flex;gap:12px;align-items:center;border-bottom:2px dashed #cdc6b6;padding-bottom:10px}
ul.quests li:last-child{border:0;padding:0}
.q-when{margin-left:auto;font-size:18px;color:var(--muted);white-space:nowrap}
.first .q-title{color:var(--orange)}

/* workers */
.workers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.worker{border:3px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff;position:relative}
.worker.mvp{background:#fff7d6}
.worker .head{display:flex;gap:12px;align-items:center}
.statrow{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:8px;font-size:18px}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:10px}
.pips i{background:#ddd6c6}.pips i.on{background:var(--blue)}
.quote{font-size:19px;color:var(--muted)}
.mvp-badge{position:absolute;top:-14px;right:10px;font-family:var(--pixel);font-size:8px;background:var(--orange);color:#fff;padding:5px 6px;border:2px solid var(--ink)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.polaroid{background:#fff;border:3px solid var(--ink);padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;margin:0}
.polaroid:nth-child(odd){transform:rotate(-1.2deg)}.polaroid:nth-child(even){transform:rotate(1deg)}
.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#ddd}
.polaroid figcaption{font-size:19px;display:flex;justify-content:space-between;gap:8px}
.empty{display:flex;gap:16px;align-items:center;border:3px dashed #b9b1a0;padding:18px}

/* log */
ol.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.log li{display:grid;grid-template-columns:auto 110px 1fr;gap:12px;align-items:center}
ol.log .d{color:var(--muted);font-variant-numeric:tabular-nums}

/* help button */
.helpbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--hazard);padding:12px 16px;position:relative}
.helpbar .hb-count{display:flex;flex-direction:column;gap:2px;min-width:0}
.helpbar .hb-num{font-family:var(--pixel);font-size:20px;font-variant-numeric:tabular-nums}
.helpbar .hb-lbl{font-size:18px;color:var(--muted)}
.helpbar .hb-msg{font-size:20px;flex:1;min-width:160px;color:var(--blue)}
.helpbtn{display:flex;align-items:center;gap:10px;font-size:12px;padding:12px 16px;background:var(--orange);color:#fff;position:relative}
.helpbtn:hover{background:#f27a40}
.helpbtn .sprite{transform-origin:70% 90%}
.helpbtn.whack .sprite{animation:whack .25s steps(3)}
@keyframes whack{0%{transform:rotate(0)}50%{transform:rotate(-35deg)}100%{transform:rotate(0)}}
.plus1{position:absolute;font-family:var(--pixel);font-size:14px;color:var(--orange);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:floatup .9s steps(9) forwards}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-48px);opacity:0}}
@media (prefers-reduced-motion:reduce){.helpbtn.whack .sprite,.plus1{animation:none}.plus1{display:none}}

/* floor plan */
.fp-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.fp{border:3px solid var(--ink);background:#d6d0c2;padding:8px;min-width:0}
.fp svg{width:100%;height:auto;display:block}
.fp .rname{font-family:var(--pixel);font-size:2.3px;fill:var(--ink)}
.fp .rarea{font-family:var(--body);font-size:3.8px;fill:var(--ink)}
.fp .rbadge{font-family:var(--pixel);font-size:1.7px}
.fp .entry{font-family:var(--pixel);font-size:1.9px;fill:var(--ink)}
.fp g.room{cursor:default}
.fp g.room:hover rect.fill,.fp g.room:hover path.fill{filter:brightness(1.06)}
.fp g.room.sel rect.fill,.fp g.room.sel path.fill{stroke:var(--orange);stroke-width:1}
ul.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.rooms li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-bottom:2px dashed #cdc6b6;padding-bottom:8px}
ul.rooms li:last-child{border:0}
ul.rooms li.sel .rn{color:var(--orange)}
ul.rooms .rn{font-size:23px}
ul.rooms .ra{font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
ul.rooms .rnote{grid-column:1/-1;font-size:18px;color:var(--muted)}
.chip{font-family:var(--pixel);font-size:8px;letter-spacing:.04em;padding:5px 6px;border:2px solid var(--ink);white-space:nowrap}
.chip.done{background:var(--green);color:#fff}.chip.doing{background:var(--hazard)}.chip.todo{background:#e5e0d4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:18px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);vertical-align:-2px;margin-right:5px}
.area-done{display:flex;flex-direction:column;gap:6px}
.area-done .meter{height:14px}
.room-ed{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1.5fr);gap:8px;align-items:end}

/* buttons & forms */
button,.btn{font-family:var(--pixel);font-size:10px;letter-spacing:.04em;background:var(--hazard);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:9px 12px;cursor:pointer}
button:hover{background:#ffd54d}
button:active{transform:translate(3px,3px);box-shadow:none}
button.ghost{background:var(--paper)}
button.danger{background:#f2b8ad}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button[disabled]{opacity:.5;cursor:wait}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{background:var(--hazard);border:3px solid var(--ink);padding:10px 14px;font-size:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(31,28,25,.6);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.editor{width:min(760px,100%)}
.editor label{display:flex;flex-direction:column;gap:4px;font-size:18px;min-width:0}
.editor input,.editor textarea,.editor select{font-family:var(--body);font-size:20px;border:3px solid var(--ink);background:#fff;color:var(--ink);padding:6px 8px;width:100%}
.editor textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.hint{font-size:17px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--hazard);font-family:var(--pixel);font-size:10px;padding:12px 16px;z-index:30;border:3px solid var(--hazard)}
footer{text-align:center;font-family:var(--pixel);font-size:9px;color:var(--muted);line-height:2}

@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.fp-wrap{grid-template-columns:1fr}}
@media (max-width:560px){.room-ed{grid-template-columns:1fr 1fr}.room-ed label:last-child{grid-column:1/-1}}
@media (max-width:420px){ol.log li{grid-template-columns:auto 1fr}ol.log .d{grid-column:2}}
</style>

function updateHelp(){

async function flushHelp(){

function helpClick(ev){

function mood(p){

}

function spriteAt(name, x, y, size){
  const rows = SPR[name]; if (!rows) return '';
  const w = Math.max(...rows.map(r=>r.length)), h = rows.length, sc = size / Math.max(w,h);
  let r = '';
  rows.forEach((row,yy)=>{for(let xx=0;xx<row.length;xx++){const c=PAL[row[xx]];if(c) r+=`<rect x="${xx}" y="${yy}" width="1.02" height="1.02" fill="${c}"/>`;}});
  return `<svg x="${x - w*sc/2}" y="${y}" width="${w*sc}" height="${h*sc}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
}

function floorPlan(s){

  const total = s.rooms.reduce((a,r)=>a+ROOM_GEO[r.key].area,0);

            <pattern id="fp-done" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#bcd9a8"/><rect width="1" height="1" fill="#9cc488"/></pattern>
            <pattern id="fp-todo" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#f3efe4"/><rect width=".7" height=".7" fill="#bdb6a6"/></pattern>
          </defs>
          <rect x="0" y="0" width="90" height="63" fill="#1f1c19"/>
          <rect x="0" y="61" width="108" height="63" fill="#1f1c19"/>
          <rect x="37.5" y="2" width="4" height="40.5" fill="#5b5f5d"/>

        <div class="area-done">
          <span><b style="font-family:var(--pixel);font-size:12px">${done.toFixed(1)} m²</b> of ${total.toFixed(2)} m² finished · ${nDone} of ${s.rooms.length} rooms</span>
          <div class="meter" aria-hidden="true"><span style="width:${(done/total*100).toFixed(1)}%"></span><span style="left:${(done/total*100).toFixed(1)}%;width:${(doing/total*100).toFixed(1)}%;background:var(--hazard)"></span></div>
        </div>
        <ul class="rooms">${s.rooms.map(r=>`<li class="${selRoom===r.key?'sel':''}" data-room="${r.key}">

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

function buildDoc(next){
  const reset = document.head.querySelector('style')?.textContent || '';
  const css = document.getElementById('page-css').textContent;
  const js = document.getElementById('app-js').textContent;
  const json = JSON.stringify(next).replace(/</g,'\\u003c');
  const S = 'script';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>'
    + '<title>Renovation Quest</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">\n'
    + '<style id="page-css">' + css + '</style>\n<div class="hazard"></div>\n<main class="wrap" id="app"></main>\n<div class="hazard"></div>\n'
    + '<' + S + ' id="state" type="application/json">' + json + '</' + S + '>\n'
    + '<' + S + ' id="app-js">' + js + '</' + S + '>'
    + '</body></html>';
}

async function save(next, msg){
  if (!artifactApi || busy) return;
  busy = true; toast('Saving…');
  try { await artifactApi.publish(buildDoc(next)); toast(msg || 'Saved'); }
  catch(e){ busy = false; toast(e && e.code === 'conflict' ? 'Someone else saved first. Reloading.' : 'Could not save: ' + (e && (e.message||e.code) || 'unknown error')); }
}

function bind(){
  app.querySelectorAll('[data-room]').forEach(el => {
    const pick = () => { const k = el.dataset.room; app.querySelectorAll('[data-room]').forEach(x => x.classList.toggle('sel', x.dataset.room === k)); selRoom = k; };
    el.addEventListener('click', pick); el.addEventListener('mouseenter', pick);
  });
  document.getElementById('btn-help')?.addEventListener('click', helpClick);
  updateHelp();
  document.getElementById('btn-edit')?.addEventListener('click', openEditor);
  document.getElementById('btn-done')?.addEventListener('click', () => {
    const n = structuredClone(state); const q = n.upcoming.shift(); if (!q) return;
    n.last = { title:q.title, note:'', date:today(), icon:q.icon };
    n.log.unshift({ date:today(), title:q.title, icon:q.icon });
    save(n, 'Quest complete!');
  });
  app.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.armed) { const n = structuredClone(state); n.photos.splice(Number(b.dataset.del),1); save(n,'Photo removed'); }
    else { b.dataset.armed = '1'; b.textContent = 'Tap again to remove'; }
  }));
  document.getElementById('btn-photo')?.addEventListener('click', async (ev) => {
    const f = document.getElementById('ph-file').files[0];
    if (!f) { toast('Choose a photo first'); return; }
    if (!/^image\//.test(f.type)) { toast('That file is not an image'); return; }
    ev.target.disabled = true; toast('Uploading…');
    try {
      const a = await assetsApi.upload(f);
      const n = structuredClone(state);
      n.photos.unshift({ id:a.id, caption:document.getElementById('ph-cap').value.trim().slice(0,80), date:today() });
      await save(n, 'Photo added');
    } catch(e){ ev.target.disabled = false; toast('Upload failed: ' + (e && (e.message||e.code) || 'unknown error')); }
  });
}

    <label for="ed-up">Up next<textarea id="ed-up">${esc(s.upcoming.map(q=>[q.title,q.when,q.icon].join(' | ')).join('\n'))}</textarea>
      <span class="hint">One job per line: job | when | icon</span></label>
    <label for="ed-wk">Best workers<textarea id="ed-wk">${esc(s.workers.map(w=>[w.name,w.role,w.quote,w.speed,w.coffee,w.noise,w.icon,num(w.excuses,5)].join(' | ')).join('\n'))}</textarea>
      <span class="hint">One per line: name | role | quote | speed 0-10 | beer 0-10 | noise 0-10 | icon (worker, worker2, cat, car) | excuses 0-10. The first one is Worker of the Month.</span></label>
    <label for="ed-log">Save points (history)<textarea id="ed-log">${esc(s.log.map(l=>[l.date,l.title,l.icon].join(' | ')).join('\n'))}</textarea>
      <span class="hint">One per line: YYYY-MM-DD | what happened | icon</span></label>
    <h3>Rooms on the map</h3>
    ${s.rooms.map(r=>`<div class="room-ed">
      <label for="ed-rn-${r.key}">${ROOM_GEO[r.key].area.toFixed(2)} m²<input id="ed-rn-${r.key}" value="${esc(r.name)}" maxlength="30"></label>
      <label for="ed-rs-${r.key}">Status<select id="ed-rs-${r.key}">${Object.keys(STATUS).map(k=>`<option value="${k}" ${k===r.status?'selected':''}>${STATUS[k].toLowerCase()}</option>`).join('')}</select></label>
      <label for="ed-ro-${r.key}">Note<input id="ed-ro-${r.key}" value="${esc(r.note)}" maxlength="80"></label>
    </div>`).join('')}
    <div class="row">
      <label for="ed-cof">Beers<input id="ed-cof" type="number" min="0" value="${num(st.coffees)}"></label>
      <label for="ed-bud">Budget used %<input id="ed-bud" type="number" min="0" value="${num(st.budget)}"></label>
      <label for="ed-com">Complaints<input id="ed-com" type="number" min="0" value="${num(st.complaints)}"></label>
      <label for="ed-dust">Dust level<input id="ed-dust" value="${esc(st.dust)}"></label>
    </div>
    <p class="hint">Icons: ${ICONS.join(', ')}</p>
    <div class="toolbar"><button type="submit">Save &amp; publish</button><button type="button" class="ghost" id="ed-cancel">Cancel</button></div>
  </form>`;
  document.body.appendChild(ov);
  const $ = id => ov.querySelector('#'+id);
  $('ed-pct').addEventListener('input', e => $('ed-pct-v').textContent = e.target.value);
  $('ed-cancel').addEventListener('click', () => ov.remove());
  const lines = id => $(id).value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]);
  $('ed-form').addEventListener('submit', e => {
    e.preventDefault();
    const n = structuredClone(state);
    n.example = false;
    n.name = $('ed-name').value.trim(); n.tagline = $('ed-tag').value.trim();
    n.percent = clamp(num($('ed-pct').value),0,100);
    n.started = $('ed-start').value; n.target = $('ed-target').value;
    n.last = { title:$('ed-lt').value.trim(), note:$('ed-ln').value.trim(), date:$('ed-ld').value, icon:safeIcon($('ed-li').value) };
    n.upcoming = lines('ed-up').map(a=>({title:a[0], when:a[1]||'', icon:safeIcon(a[2])}));
    n.workers = lines('ed-wk').map(a=>({name:a[0], role:a[1]||'', quote:a[2]||'', speed:clamp(num(a[3],5),0,10), coffee:clamp(num(a[4],5),0,10), noise:clamp(num(a[5],5),0,10), icon:safeIcon(a[6]||'worker'), excuses:clamp(num(a[7],5),0,10)}));
    n.log = $('ed-log').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.some(Boolean))
      .map(a => a.length === 1 ? {date:'', title:a[0], icon:'hammer'} : {date:a[0], title:a[1]||'', icon:safeIcon(a[2])}).filter(l=>l.title);
    n.rooms = n.rooms.map(r => ({ key:r.key, name:$('ed-rn-'+r.key).value.trim() || DEFAULT_NAMES[r.key], status:STATUS[$('ed-rs-'+r.key).value] ? $('ed-rs-'+r.key).value : 'todo', note:$('ed-ro-'+r.key).value.trim() }));
    n.stats = { coffees:num($('ed-cof').value), budget:num($('ed-bud').value), complaints:num($('ed-com').value), dust:$('ed-dust').value.trim() };
    save(n, 'Published!');
  });
}

render();

(async () => {
  if (!window.claude?.use) return;
  try {
    const [user, art, assets, db] = await Promise.all([claude.use('user'), claude.use('artifact'), claude.use('assets'), claude.use('db')]);
    artifactApi = art; assetsApi = assets;
    const myId = db && user ? await user.id() : null;
    if (db && myId) {
      helpDb = db; helpMeId = myId;
      let first = true;
      db.collection('cheers').onSnapshot(snap => {
        let total = 0, mine = 0;
        snap.docs.forEach(d => { const v = Math.max(0, Math.floor(num(d.data()?.n))); total += v; if (d.id === myId) mine = v; });
        helpTotal = total; helpDbMine = mine;
        if (first) { first = false; helpSaved = mine; if (mine > helpMine) helpMine = mine; else if (helpMine > mine) { clearTimeout(helpTimer); helpTimer = setTimeout(flushHelp, 300); } }
        updateHelp();
      }, () => { helpTotal = null; updateHelp(); });
    }
    canEdit = !!art && ((await user?.canEdit()) ?? false);
    if (canEdit) render();
  } catch(e) { /* read-only view */ }
})();
})();
</script>
</body>
</html>
